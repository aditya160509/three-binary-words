name: lean
on: [push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
      - run: cd classification && ~/.elan/bin/lean --version
      - run: cd classification && time ~/.elan/bin/lean Cyclic.lean
      - run: grep -c sorry classification/Cyclic.lean || true
